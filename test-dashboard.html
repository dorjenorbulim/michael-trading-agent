<!DOCTYPE html>
<html>
<head>
  <title>Trading API Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-8" onload="testAPI()">
  <h1 class="text-3xl mb-4">Trading API Test</h1>
  <div id="status" class="text-green-400">Testing...</div>
  <button onclick="testAPI()" class="bg-blue-600 px-4 py-2 rounded mt-4">Refresh</button>
  
  <script>
    const API = 'http://localhost:3002';
    
    async function testAPI() {
      try {
        const res = await fetch(API + '/api/status');
        const data = await res.json();
        document.getElementById('status').innerHTML = 
          '<pre class="text-green-400">' + JSON.stringify(data, null, 2) + '</pre>';
      } catch(e) {
        document.getElementById('status').innerHTML = 
          '<pre class="text-red-400">ERROR: ' + e.message + '</pre>';
      }
    }
  </script>
</body>
</html>
